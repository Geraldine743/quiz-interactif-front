<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/styles.css">
    <title>Quiz intéractif</title>
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">Quiz App</div>
            <div class="user-menu">
                <span id="username-display"></span>
                <button id="logout-btn">Se déconnecter</button>
            </div>
        </nav>
    </header>

    <div class="container">

        <h1>Quiz intéractif</h1>

        <div class="difficulty-selection">
            <h2>Choisissez le niveau de difficulté:</h2>
            <button class="difficulty-btn" data-level="facile">Facile</button>
            <button class="difficulty-btn" data-level="moyenne">Moyenne</button>
            <button class="difficulty-btn" data-level="difficile">Difficile</button>
        </div>

        <div id="quiz-container" class="hidden"></div>

        <div id="result">

        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
