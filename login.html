<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page de connexion</title>
</head>
<body>
    <div class="container">
        <h1>Connexion</h1>

        <form id="login-form">
            <label for="login-username">Nom d'utilisateur:</label>
            <input type="text" name="login-username" id="login-username" placeholder="Entrez le nom d'utilisateur">

            <label for="login-password">Mot de passe :</label>
            <input type="password" name="login-password" id="login-password" placeholder="Entrez le mot de passe">
            
            <button type="button" onclick="">Se connecter</button>
        </form>

        <p>Pas encore de compte ? <a href="">S'inscrire</a></p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
