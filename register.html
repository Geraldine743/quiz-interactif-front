<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/register.css">
    <title>Page d'inscription</title>
</head>
<body>
    <div class="container">
        <h1>Inscription</h1>

        <form id="register-form">
            <label for="username">Nom d'utilisateur:</label>
            <input type="text" name="username" id="username" placeholder="Entrez le nom d'utilisateur">

            <label for="password">Mot de passe :</label>
            <input type="password" name="password" id="password" placeholder="Entrez le mot de passe">
            
            <button type="button" onclick="registerUser()">S'inscrire</button>
        </form>

        <p>Vous avez déjà un compte ? <a href="login.html">Se connecter</a></p>
    </div>
    
    <script src="register.js"></script>
</body>
</html>
